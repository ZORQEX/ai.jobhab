<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — AI JobHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236c8cff'/><text y='68' x='50' text-anchor='middle' font-size='46' font-family='Arial' font-weight='bold' fill='white'>AI</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="app-header" class="site-header"></header>

  <main id="app-main">
    <div class="container page">
      <div class="page-head page-head-user">
        <span id="user-avatar"></span>
        <div>
          <h1 id="user-name">Личный кабинет</h1>
          <p class="muted mb-0" id="user-sub"></p>
        </div>
      </div>

      <div id="quick-stats" class="stat-grid mb-16"></div>

      <div class="tabs" id="tabs">
        <button class="tab active" type="button" data-tab="history">История откликов</button>
        <button class="tab" type="button" data-tab="resume">Резюме для AI</button>
        <button class="tab" type="button" data-tab="reviews">Мои отзывы</button>
        <button class="tab" type="button" data-tab="settings">Профиль</button>
      </div>

      <section id="pane-history" class="pane"></section>
      <section id="pane-resume" class="pane hidden"></section>
      <section id="pane-reviews" class="pane hidden"></section>
      <section id="pane-settings" class="pane hidden"></section>
    </div>
  </main>

  <script type="module" src="src/pages/profile.js"></script>
</body>
</html>
